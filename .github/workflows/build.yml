name: Build KB Client 1.8.9

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Java 8
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: Install & Configure Gradle 4.10.3
        run: |
          wget -q https://services.gradle.org/distributions/gradle-4.10.3-bin.zip
          unzip -q gradle-4.10.3-bin.zip
          export PATH=$PWD/gradle-4.10.3/bin:$PATH
          gradle wrapper --gradle-version 4.10.3
          chmod +x gradlew

      - name: Download Google Fonts
        run: |
          mkdir -p src/main/resources/fonts
          
          # Inter Font (Dynamic extraction to handle version path changes)
          curl -sL https://github.com/rsms/inter/releases/download/v4.0/Inter-4.0.zip -o inter.zip
          INTER_FILE=$(unzip -l inter.zip | grep "Inter-Regular.ttf" | awk '{print $4}' | head -n 1)
          if [ -n "$INTER_FILE" ]; then
            unzip -j inter.zip "$INTER_FILE" -d src/main/resources/fonts
          else
            echo "Warning: Could not find Inter-Regular.ttf in archive"
          fi
          rm inter.zip
          
          # Vazirmatn Font (Persian) (Dynamic extraction)
          curl -sL https://github.com/rastikerdar/vazirmatn/releases/download/v4.0.0/Vazirmatn-v4.0.0.zip -o vazir.zip
          VAZIR_FILE=$(unzip -l vazir.zip | grep "Vazirmatn-Regular.ttf" | awk '{print $4}' | head -n 1)
          if [ -n "$VAZIR_FILE" ]; then
            unzip -j vazir.zip "$VAZIR_FILE" -d src/main/resources/fonts
          else
            echo "Warning: Could not find Vazirmatn-Regular.ttf in archive"
          fi
          rm vazir.zip

      - name: Build Mod with Gradle
        run: |
          ./gradlew build --no-daemon --stacktrace || ./gradlew build --no-daemon --stacktrace

      - name: Upload Mod Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KBClient-1.8.9
          path: build/libs/*.jar

      - name: Obfuscate with ProGuard
        run: |
          curl -sL -o proguard.zip https://github.com/Guardsquare/proguard/releases/download/v7.4.2/proguard-7.4.2.zip
          unzip -q proguard.zip
          mkdir -p build/obf
          for jar in build/libs/*.jar; do
            name=$(basename "$jar" .jar)
            proguard-7.4.2/bin/proguard.sh \
              -injars "$jar" \
              -outjars "build/obf/${name}-obf.jar" \
              @proguard-rules.pro
          done

      - name: Upload Obfuscated Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KBClient-1.8.9-obfuscated
          path: build/obf/*.jar